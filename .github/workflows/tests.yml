name: Tests
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@0c1592977591ecba077a4666d699840062711201
    with:
      standards-ref: 0c1592977591ecba077a4666d699840062711201
      domain: xiaomi_lywsd
      python-versions: '["3.14"]'
      requirements: requirements-test.txt
      expected-ha-version: '2026.10.2'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/xiaomi_lywsd/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@0c1592977591ecba077a4666d699840062711201
    with:
      standards-ref: 0c1592977591ecba077a4666d699840062711201
      domain: xiaomi_lywsd
      python-versions: '["3.13"]'
      requirements: requirements-test-minimum.txt
      expected-ha-version: '2025.1.0'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/xiaomi_lywsd/ -v
