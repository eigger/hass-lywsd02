name: Tests
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@648dad941a118c80325f44c7a13cb5b5b9c1c788
    with:
      standards-ref: 648dad941a118c80325f44c7a13cb5b5b9c1c788
      domain: xiaomi_lywsd
      python-versions: '["3.14"]'
      requirements: requirements-test.txt
      expected-ha-version: '2026.10.2'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/xiaomi_lywsd/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@648dad941a118c80325f44c7a13cb5b5b9c1c788
    with:
      standards-ref: 648dad941a118c80325f44c7a13cb5b5b9c1c788
      domain: xiaomi_lywsd
      python-versions: '["3.13"]'
      requirements: requirements-test-minimum.txt
      expected-ha-version: '2025.1.0'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/xiaomi_lywsd/ -v
