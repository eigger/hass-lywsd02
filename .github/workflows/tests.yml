name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0
    with:
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
      domain: xiaomi_lywsd
      python-versions: '["3.14"]'
      requirements: requirements-test.txt
      expected-ha-version: '2026.10.2'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/xiaomi_lywsd/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0
    with:
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
      domain: xiaomi_lywsd
      python-versions: '["3.13"]'
      requirements: requirements-test-minimum.txt
      expected-ha-version: '2025.1.0'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/xiaomi_lywsd/ -v
