version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      - requirements-test-minimum.txt
    groups:
      home-assistant-tests:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
